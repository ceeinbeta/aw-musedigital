# Firebase App Hosting configuration (server-rendered Next.js).
# The backend is created once in the Firebase console and linked to the
# GitHub repository; every push to the live branch then rebuilds the site.
# Step-by-step instructions are in DEPLOYMENT.md.

runConfig:
  minInstances: 0
  # Form spam limits are counted per instance, so keep this low.
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Uncomment each entry once its value exists. Values are never invented here.
# Public values (NEXT_PUBLIC_*) are built into the pages, so they need BUILD.
# Secrets are stored in Google Cloud Secret Manager, never in this file:
#   firebase apphosting:secrets:set RESEND_API_KEY
#   firebase apphosting:secrets:set SANITY_REVALIDATE_SECRET

# env:
#   - variable: NEXT_PUBLIC_SITE_URL
#     value: https://your-domain   # the final domain, no trailing slash
#     availability: [BUILD, RUNTIME]
#
#   - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
#     value: your-project-id
#     availability: [BUILD, RUNTIME]
#
#   - variable: NEXT_PUBLIC_SANITY_DATASET
#     value: production
#     availability: [BUILD, RUNTIME]
#
#   - variable: NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG
#     value: your-tag-21
#     availability: [BUILD, RUNTIME]
#
#   # Optional. Setting it switches on the cookie consent banner.
#   - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
#     value: G-XXXXXXXXXX
#     availability: [BUILD, RUNTIME]
#
#   - variable: EMAIL_FROM
#     value: "MUSE DIGITAL <hello@your-domain>"
#     availability: [RUNTIME]
#
#   - variable: ENQUIRY_TO_EMAIL
#     value: inbox@your-domain
#     availability: [RUNTIME]
#
#   - variable: RESEND_API_KEY
#     secret: RESEND_API_KEY
#     availability: [RUNTIME]
#
#   - variable: SANITY_REVALIDATE_SECRET
#     secret: SANITY_REVALIDATE_SECRET
#     availability: [RUNTIME]
